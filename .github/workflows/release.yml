# Builds the release archives for a version tag (v0.2.0), when started by hand:
#
# 1. On Windows and Linux (x86_64-unknown-linux-gnu; also -musl, static, when
#    the "musl" input is ticked), scripts/package.* build the full and lean
#    variants with --locked, on the toolchain rust-toolchain.toml pins, from
#    the tagged commit, and archive them. The Windows full build has the
#    `desktop` feature (the window with no listening port); the
#    lean build and Linux don't. Every archive holds THIRD-PARTY-LICENSES.md
#    (cargo-about) and CycloneDX SBOMs (sbom/); each archive's SBOM is also
#    attached beside it (<archive>.cdx.json).
# 2. One job then writes SHA256SUMS.txt fresh over all archives and SBOMs,
#    records build provenance for them (Sigstore-signed, verifiable with
#    `gh attestation verify`), and attaches everything to a draft release.
#
# Publish the draft by hand once you have checked it. See docs/dev/building.md,
# "Verifying a download" and "Code signing".
#
# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment); update both together.
name: Release

# By hand only (Actions > Release > Run workflow, choosing the tag): releases
# are normally built locally with scripts/package.ps1 (docs/dev/building.md).
on:
  workflow_dispatch:
    inputs:
      musl:
        description: Also build static Linux archives (x86_64-unknown-linux-musl)
        type: boolean
        default: false
      linux_only:
        description: Build only the Linux archives, as a run artifact, with no release (the Windows zips are built and signed locally)
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Package (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            package: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1
            archives: dist/*.zip
          # The oldest supported runner, so the binaries need the oldest glibc.
          - name: linux-x64
            os: ubuntu-22.04
            package: sh scripts/package.sh
            archives: dist/*.tar.gz
          - name: linux-x64-musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            package: sh scripts/package.sh --target x86_64-unknown-linux-musl
            archives: dist/*.tar.gz
        exclude:
          # Only when asked for (the "musl" input).
          - name: ${{ !inputs.musl && 'linux-x64-musl' || 'none' }}
          # Not when only the Linux archives are asked for.
          - name: ${{ inputs.linux_only && 'windows-x64' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only from a tag (Run workflow > Use workflow from > Tags): a branch's
      # head would be released under whatever name it has.
      - name: Check it runs from a tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this from a version tag, not $REF"
            exit 1
          fi
      # The version in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Prebuilt, checksum-verified binaries: cargo-about writes
      # THIRD-PARTY-LICENSES.md, cargo-cyclonedx the SBOMs.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3,cargo-cyclonedx@0.5.10
      - name: Check the tag matches the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version in Cargo.toml ($version)"
            exit 1
          fi
      # Builds with --locked and refuses a dirty tree (scripts/package.*).
      # On Windows the full variant is built with `--features pathwarden/desktop`.
      # package.ps1 signs the Windows executables only when PW_SIGN_* are set
      # (docs/dev/building.md, "Code signing"); they are not set here yet, so the
      # CI archives are unsigned. To sign here: an Azure login step
      # (azure/login with OIDC, pinned by SHA) in a protected `release`
      # environment, the signtool dlib, and PW_SIGN_* from its variables.
      - name: Build and package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            ${{ matrix.archives }}
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag' && !inputs.linux_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach the archives
      id-token: write # sign the provenance through Sigstore
      attestations: write # store the provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- *.zip *.tar.gz *.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Build provenance (SLSA, signed through Sigstore) for every archive and
      # SBOM, the Linux ones included. It needs a public repository (or GitHub
      # Enterprise Cloud for a private one), so it is skipped while the
      # repository is private.
      - name: Record build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.cdx.json

      # SHA256SUMS.txt is signed afterwards by sign-sums.yml (Actions > Sign
      # release sums, on main, with the tag), as for a locally built release.

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A published release's archives, which people have downloaded
            # and checked against its sums, are never replaced.
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is published; its files are not replaced. Make a new version instead."
              exit 1
            fi
            # Nor are a draft's: they may be the signed archives uploaded by
            # hand, and new sums would leave their signature bundle stale.
            existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            clash=""
            for f in dist/*; do
              name=$(basename -- "$f")
              if printf '%s\n' "$existing" | grep -qxF -- "$name"; then
                clash="$clash $name"
              fi
            done
            if [ -n "$clash" ]; then
              echo "::error::the draft of $TAG already holds:$clash. They are not replaced: delete them (and the sums' signature bundle) from the draft, then run this again."
              exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes --title "Pathwarden $TAG"
          fi
