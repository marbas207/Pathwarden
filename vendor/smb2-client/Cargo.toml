# smb2-client 0.2.5 by icedracon (https://github.com/icedracon/smb2-client,
# MIT, LICENSE kept here), vendored by Pathwarden from crates.io (the commit
# before this one is the published crate, unmodified) with one change, for
# Pathwarden: required signing. The client can ask the server
# to sign and refuse any reply after sign-in whose signature is missing or
# wrong (src/lib.rs `set_require_signing`, src/client.rs `call`,
# src/header.rs `verify`; every change is marked "Pathwarden patch").
# Off by default, so behaviour is unchanged unless a caller turns it on.
# Also: a refused Kerberos SESSION_SETUP says which KRB-ERROR the server sent
# (SmbError::KerberosRefused) instead of a bare NTSTATUS.
# And: `read_file_max` and `list_directory_max`, a file read and a
# directory listing that stop at a given size and open links as themselves
# (FILE_OPEN_REPARSE_POINT), for scheduled task files read off computers that
# may lie; DirEntry carries the FileAttributes.
# Drop the vendored copy once an upstream release checks reply signatures.
# Its own tests: cargo test --manifest-path vendor/smb2-client/Cargo.toml --lib
# (manifest as normalized by crates.io; the original is in the crate on crates.io)

# Not part of Pathwarden's workspace (it is excluded there too).
[workspace]

[package]
edition = "2021"
rust-version = "1.74"
name = "smb2-client"
version = "0.2.5"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Minimal async SMB2 client in pure Rust: negotiate, NTLMv2 (SPNEGO) session setup, message signing (HMAC-SHA256 / AES-CMAC), tree connect, named-pipe and file I/O — no FFI."
documentation = "https://docs.rs/smb2-client"
readme = "README.md"
keywords = [
    "smb",
    "smb2",
    "cifs",
    "ntlm",
    "windows",
]
categories = [
    "network-programming",
    "authentication",
    "os::windows-apis",
]
license = "MIT"
repository = "https://github.com/icedracon/smb2-client"

[badges.maintenance]
status = "actively-developed"

[lib]
name = "smb2_client"
path = "src/lib.rs"

[dependencies.aes]
version = "0.8"

[dependencies.cmac]
version = "0.7"

[dependencies.hmac]
version = "0.12"

[dependencies.ntlmssp]
version = "0.1"

[dependencies.rand]
version = "0.8"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "net",
    "io-util",
    "time",
    "rt",
    "sync",
]

[dependencies.tracing]
version = "0.1"
