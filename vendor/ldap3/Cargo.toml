# ldap3 0.12.1, vendored by Pathwarden from the `pathwarden` branch of
# https://github.com/marbas207/ldap3 (commit 119815e): upstream 0.12.1 plus
#   - inejge/ldap3#160: the SASL (GSSAPI sealing) decoder kept only one LDAP
#     message per sealed buffer and hung searches (src/protocol.rs);
#   - inejge/ldap3#159: a public SASL bind step (Ldap::sasl_bind), for Kerberos on Linux.
# To update: merge upstream into that branch, then copy its src/ here.
# Drop the vendored copy once an upstream release has both.
# Examples and dev-dependencies left out. Its own tests (the decoder's
# included): cargo test --manifest-path vendor/ldap3/Cargo.toml --lib
#   --no-default-features --features gssapi

# Not part of Pathwarden's workspace (it is excluded there too).
[workspace]

[package]
edition = "2024"
name = "ldap3"
version = "0.12.1"
authors = ["Ivan Nejgebauer <inejge@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust LDAP Client"
documentation = "https://docs.rs/ldap3"
readme = "README.md"
keywords = [
    "ldap",
    "client",
    "tokio",
    "async",
]
categories = [
    "authentication",
    "network-programming",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/inejge/ldap3"

[package.metadata.docs.rs]
default-features = false
features = [
    "sync",
    "tls",
    "gssapi",
    "ntlm",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = [
    "sync",
    "tls",
]
gssapi = [
    "cross-krb5",
    "dep:ring",
    "dep:either",
]
ntlm = [
    "sspi",
    "dep:ring",
]
rustls-provider = []
sync = ["tokio/rt"]
tls = ["tls-native"]
tls-native = [
    "dep:native-tls",
    "dep:tokio-native-tls",
    "tokio/rt",
]
tls-rustls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
    "dep:x509-parser",
    "tokio/rt",
]
tls-rustls-aws-lc-rs = [
    "tls-rustls",
    "rustls/aws_lc_rs",
    "rustls-provider",
]
tls-rustls-ring = [
    "tls-rustls",
    "rustls/ring",
    "rustls-provider",
]

[lib]
name = "ldap3"
path = "src/lib.rs"

[dependencies.async-trait]
version = "0.1.89"

[dependencies.bytes]
version = "1.10.1"

[dependencies.cross-krb5]
version = "0.4.2"
optional = true

[dependencies.either]
version = "1.15.0"
optional = true

[dependencies.futures]
version = "0.3.31"

[dependencies.futures-util]
version = "0.3.31"

[dependencies.lber]
version = "0.5.1"

[dependencies.log]
version = "0.4.28"

[dependencies.native-tls]
version = "0.2.14"
optional = true

[dependencies.nom]
version = "7.1.3"

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.ring]
version = "0.17.14"
optional = true

[dependencies.rustls]
version = "0.23.31"
features = [
    "logging",
    "std",
    "tls12",
]
optional = true
default-features = false

[dependencies.rustls-native-certs]
version = "0.8.1"
optional = true

[dependencies.sspi]
version = "0.16.1"
optional = true

[dependencies.thiserror]
version = "2.0.16"

[dependencies.tokio]
version = "1.47.1"
features = [
    "macros",
    "io-util",
    "sync",
    "time",
    "net",
]

[dependencies.tokio-native-tls]
version = "0.3.1"
optional = true

[dependencies.tokio-rustls]
version = "0.26.2"
features = [
    "logging",
    "tls12",
]
optional = true
default-features = false

[dependencies.tokio-stream]
version = "0.1.17"

[dependencies.tokio-util]
version = "0.7.16"
features = ["codec"]

[dependencies.url]
version = "2.5.7"

[dependencies.x509-parser]
version = "0.18.0"
optional = true
