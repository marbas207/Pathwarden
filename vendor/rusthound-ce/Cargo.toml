# Not part of Pathwarden's workspace (it is excluded there too).
[workspace]

# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
rust-version = "1.88"
name = "rusthound-ce"
version = "2.5.30"
authors = ["g0h4n <g0h4n_0@protonmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Active Directory data collector for Bloodhound Community Edition written in rust."
homepage = "https://github.com/g0h4n/RustHound-CE"
documentation = "https://docs.rs/rusthound-ce/"
readme = "README.md"
keywords = [
    "bloodhound",
    "pentest",
    "ldap",
    "tokio",
    "async",
]
license = "MIT"
repository = "https://github.com/g0h4n/RustHound-CE"

[features]
default = [
    "ldap3/tls-rustls-ring",
    "ldap3/gssapi",
    "ldap3/ntlm",
]
noargs = ["winreg"]
nogssapi = [
    "ldap3/tls-rustls-ring",
    "ldap3/ntlm",
]

[lib]
name = "rusthound_ce"
path = "src/lib.rs"

[[bin]]
name = "rusthound-ce"
path = "src/main.rs"

[dependencies.aho-corasick]
version = "1.1"

[dependencies.anyhow]
version = "1"

[dependencies.bincode]
version = "2.0.1"

[dependencies.bitflags]
version = "2.4.1"

[dependencies.chrono]
version = "0.4"

[dependencies.clap]
version = "4.5.23"

[dependencies.colored]
version = "2"

[dependencies.dcerpc]
version = "0.2.11"

[dependencies.env_logger]
version = "0.11"

[dependencies.futures]
version = "0.3"

[dependencies.indicatif]
version = "0.17"

[dependencies.lazy_static]
version = "1.4.0"

[dependencies.ldap3]
version = "0.12.1"
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.mimalloc]
version = "0.1"

[dependencies.ms-pac-forge]
version = "0.1.3"

[dependencies.nom7]
version = "7.0"
package = "nom"

[dependencies.obfstr]
version = "0.4.1"

[dependencies.once_cell]
version = "1.19"

[dependencies.p12-keystore]
version = "0.3"

[dependencies.picky]
version = "=7.0.0-rc.17"

[dependencies.picky-asn1]
version = "0.10"

[dependencies.picky-asn1-der]
version = "0.5"

[dependencies.picky-krb]
version = "=0.11.1"

[dependencies.quick-xml]
version = "0.41"

[dependencies.rand]
version = "0.8"

[dependencies.rayon]
version = "1.10"

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.12"
features = [
    "blocking",
    "rustls-tls",
]
default-features = false

[dependencies.rpassword]
version = "7.2"

[dependencies.rustls]
version = "0.23"
features = [
    "ring",
    "std",
]
default-features = false

[dependencies.rustls-pemfile]
version = "2"

[dependencies.rustls-pki-types]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[dependencies.sha1]
version = "0.10"

[dependencies.smb2-client]
version = "0.2.4"

[dependencies.tokio]
version = "1.42.0"
features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
]

[dependencies.hickory-resolver]
version = "0.26.3"

[dependencies.windows-sddl]
version = "0.1"

[dependencies.winreg]
version = "0.52"
optional = true

[dependencies.x509-parser]
version = "0.16"

[dependencies.zip]
version = "9.4.1"
features = ["deflate"]
default-features = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
