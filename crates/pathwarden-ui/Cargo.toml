[package]
name = "pathwarden-ui"
description = "Local web UI for Pathwarden: collect or upload, analyze, and browse reports without the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anstream = "1"
anstyle = "1"
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "query", "json", "form"] }
clap.workspace = true
flate2 = "1"
getrandom = "0.2"
regex = "1"
sha2 = "0.10"
pathwarden-collect = { path = "../pathwarden-collect", default-features = false }
pathwarden-core = { path = "../pathwarden-core" }
# Findings files (SARIF, DefectDojo) from the run page (src/evidence_ui.rs).
pathwarden-export = { path = "../pathwarden-export" }
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
tokio = { version = "1", features = ["rt", "net", "fs", "io-util", "signal", "sync", "time"] }

# Owner-only folder permissions, opening the browser without the link on a
# command line (and finding Edge or Chrome for an app window), an exclusive
# listening socket, and whether this computer is in a domain (see
# src/perms.rs, src/launch.rs, src/lib.rs, src/collect/detect.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Offer the built-in LDAP collector in the Collect wizard. The `pathwarden`
# binary turns this on with its `builtin-collector` feature; without it the
# wizard offers SharpHound and uploads only.
builtin = ["pathwarden-collect/builtin"]

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
zip.workspace = true
