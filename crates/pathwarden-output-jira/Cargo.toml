[package]
name = "pathwarden-output-jira"
description = "Pathwarden output plugin: findings as Jira issues (Cloud REST v3, Data Center REST v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pathwarden-output-jira"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2"
zeroize = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }
